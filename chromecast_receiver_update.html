<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPlayer Chromecast</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        cast-media-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            --theme-hue: 260;
            --playback-logo-image: none;
            --buffering-image: none;
            --splash-image: none;
            --pause-image: none;
            --play-image: none;
            --progress-color: transparent;
            --spinner-color: transparent;
            pointer-events: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0d10;
            color: #FFFFFF;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #background-blur {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(70px) brightness(0.22) saturate(1.4);
            z-index: 2;
            transition: background-image 0.8s ease-in-out;
            transform: scale(1.05);
        }

        #background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(11, 13, 16, 0.4) 0%, rgba(11, 13, 16, 0.95) 100%);
            background-color: #0b0d10;
            z-index: 3;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            padding: 6vh 6vw;
            gap: 6vw;
            z-index: 10;
            overflow: hidden;
            align-items: center;
            justify-content: space-between;
            transition: padding 0.45s ease;
        }

        .main-container.no-lyrics {
            justify-content: center;
            align-items: center;
            padding: 6vh 6vw;
            gap: 0;
        }

        .main-container.no-lyrics .right-column {
            display: none;
        }

        .main-container.no-lyrics .left-column {
            flex: none;
            width: 480px;
            max-width: 90vw;
            align-items: center;
        }

        .main-container.no-lyrics .artwork-wrapper {
            width: 380px;
            height: 380px;
            max-width: 44vh;
            max-height: 44vh;
        }

        .left-column {
            flex: 0 0 380px;
            max-width: 420px;
            width: 32vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 26px;
            transition: all 0.45s ease;
        }

        .artwork-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            max-width: 38vh;
            max-height: 38vh;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
            background-color: #161a22;
        }

        .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .artwork-wrapper:hover .cover {
            transform: scale(1.03);
        }

        .info-wrapper {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.25;
            color: #FFFFFF;
            letter-spacing: -0.02em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            max-width: 100%;
        }

        .artist {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.72);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .player-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8B5CF6 0%, #C084FC 100%);
            border-radius: 999px;
            transition: width 0.25s linear;
        }

        .time-container {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border-radius: 999px;
            background-color: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #A78BFA;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .beta-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            background-color: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60A5FA;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .right-column {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .lyrics-scroller {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 28px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 40vh 0;
        }

        .lyric-line {
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.28);
            line-height: 1.35;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transform-origin: left center;
        }

        .lyric-line.active {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: 900;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.1);
        }



        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                justify-content: center;
                gap: 20px;
                padding: 4vh 4vw;
            }
            .left-column {
                width: 100%;
                max-width: 320px;
            }
            .right-column {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="background-blur"></div>
    <div id="background-overlay"></div>

    <div class="main-container">
        <div class="left-column">
            <div class="artwork-wrapper">
                <img id="cover" class="cover" src="" alt="Album Cover">
            </div>
            <div class="info-wrapper">
                <div id="title" class="title">Esperando contenido...</div>
                <div id="artist" class="artist">MMPlayer Chromecast</div>
            </div>
            <div class="player-controls">
                <div class="progress-container">
                    <div class="progress-bar-container">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <div class="time-container">
                        <span id="time-current">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 8px; align-self: flex-start;">
                <div class="status-badge" id="sync-status">Conectado</div>
                <div class="beta-badge">Chromecast</div>
            </div>
        </div>

        <div class="right-column">
            <div id="lyrics-scroller" class="lyrics-scroller">
                <div class="lyric-line" style="text-align: center;">No hay letras cargadas</div>
            </div>
        </div>
    </div>



    <!-- Official CAF Media Player element for Google Cast Framework -->
    <cast-media-player></cast-media-player>

    <script>
        var mainContainer    = document.querySelector('.main-container');
        var titleEl          = document.getElementById('title');
        var artistEl         = document.getElementById('artist');
        var coverEl          = document.getElementById('cover');
        var statusEl         = document.getElementById('sync-status');
        var backgroundBlur   = document.getElementById('background-blur');
        var lyricsScroller   = document.getElementById('lyrics-scroller');
        var progressFill     = document.getElementById('progress-fill');
        var timeCurrentEl    = document.getElementById('time-current');
        var timeTotalEl      = document.getElementById('time-total');

        function showDebugError(label, details) {
            console.error('ERR -> ' + label + ': ', details);
        }

        function addLog(msg) {
            console.log('[CastReceiver]', msg);
        }

        var FALLBACK_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2'><rect width='20' height='20' x='2' y='2' rx='2'/><circle cx='12' cy='12' r='4'/></svg>";

        var lyrics             = [];
        var currentActiveIndex = -1;
        var currentServerUrl   = '';
        var lastNextTriggerTime = 0;
        var currentAudioUrl    = '';

        function setStatus(text, isError) {
            statusEl.innerText = text;
            if (isError) {
                statusEl.style.backgroundColor = "rgba(239,68,68,0.15)";
                statusEl.style.color = "#FCA5A5";
                statusEl.style.borderColor = "rgba(239,68,68,0.3)";
            } else {
                statusEl.style.backgroundColor = "rgba(139,92,246,0.15)";
                statusEl.style.color = "#A78BFA";
                statusEl.style.borderColor = "rgba(139,92,246,0.3)";
            }
        }

        coverEl.onerror = function() {
            var failedSrc = coverEl.src;
            coverEl.src = FALLBACK_COVER;
            backgroundBlur.style.backgroundImage = "none";
            addLog('Cover failed to load: ' + failedSrc);
        };

        function updateCover(url) {
            if (url) {
                coverEl.src = url;
                backgroundBlur.style.backgroundImage = "url('" + url + "')";
            } else {
                coverEl.src = FALLBACK_COVER;
                backgroundBlur.style.backgroundImage = "none";
            }
        }

        // Test connectivity to audio URL directly via fetch to check HTTP status & CORS
        function testAudioUrl(url) {
            if (!url) return;
            fetch(url, { method: 'HEAD', mode: 'cors' })
                .then(function(res) {
                    var probeText = 'HTTP ' + res.status + ' ' + res.statusText + ' | Content-Type: ' + (res.headers.get('content-type') || 'N/A');
                    addLog('Probe result: ' + probeText);
                })
                .catch(function(err) {
                    var probeText = 'FALLO RED/CORS: ' + (err ? err.message : 'Error desconocido');
                    addLog('Probe error: ' + probeText);
                });
        }

        function parseLRC(lrcText) {
            if (!lrcText) return [];
            var result = [];
            var lines = lrcText.split(/\r?\n/);
            var timeTagRegex = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

            for (var li = 0; li < lines.length; li++) {
                var line = lines[li];
                if (!line.trim()) continue;
                var times = [];
                var match;
                timeTagRegex.lastIndex = 0;

                while ((match = timeTagRegex.exec(line)) !== null) {
                    var min = parseInt(match[1], 10);
                    var sec = parseInt(match[2], 10);
                    var ms = 0;
                    if (match[3]) {
                        var msStr = match[3].trim().padEnd(3, '0').substring(0, 3);
                        ms = parseInt(msStr, 10);
                    }
                    times.push(min * 60 + sec + ms / 1000);
                }

                var text = line.replace(timeTagRegex, '').trim();
                if (text && times.length > 0) {
                    for (var ti = 0; ti < times.length; ti++) {
                        result.push({ time: times[ti], text: text });
                    }
                }
            }
            return result.sort(function(a, b) { return a.time - b.time; });
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === null) return '0:00';
            var mins = Math.floor(seconds / 60);
            var secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function renderLyrics(lrcText) {
            lyrics = parseLRC(lrcText);
            currentActiveIndex = -1;
            lyricsScroller.innerHTML = '';
            lyricsScroller.style.transform = 'translateY(0px)';

            if (!lyrics || lyrics.length === 0) {
                mainContainer.classList.add('no-lyrics');
                return;
            }
            mainContainer.classList.remove('no-lyrics');
            lyrics.forEach(function(item, index) {
                var div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = 'lyric-' + index;
                div.innerText = item.text;
                lyricsScroller.appendChild(div);
            });
        }

        function syncLyrics(currentTime) {
            if (!lyrics || lyrics.length === 0) return;
            var activeIndex = -1;
            for (var i = 0; i < lyrics.length; i++) {
                if (currentTime >= lyrics[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex === currentActiveIndex) return;
            currentActiveIndex = activeIndex;

            var lines = lyricsScroller.children;
            for (var i = 0; i < lines.length; i++) {
                if (i === activeIndex) {
                    lines[i].classList.add('active');
                    var containerHeight = lyricsScroller.parentElement.clientHeight;
                    var lineOffsetTop   = lines[i].offsetTop;
                    var lineHeight      = lines[i].clientHeight;
                    var targetY         = -(lineOffsetTop - (containerHeight / 2) + (lineHeight / 2));
                    lyricsScroller.style.transform = 'translateY(' + targetY + 'px)';
                } else {
                    lines[i].classList.remove('active');
                }
            }
        }

        function notifyNextTrack() {
            var now = Date.now();
            if (now - lastNextTriggerTime < 3000) return; // Debounce 3s
            lastNextTriggerTime = now;

            addLog('Song finished naturally, notifying sender...');
            try {
                if (castContext) {
                    castContext.sendCustomMessage(CAST_NAMESPACE, undefined, { action: 'TRACK_ENDED' });
                }
            } catch (e) {
                addLog('Error sending TRACK_ENDED via Cast channel: ' + e);
            }
        }

        // Initialize Google Cast CAF Receiver
        if (typeof cast !== 'undefined' && cast.framework) {
            try {
                var castContext = cast.framework.CastReceiverContext.getInstance();
                var CAST_NAMESPACE = 'urn:x-cast:com.pescalerag.mmplayer';

                // 1. Canal personalizado: Recibe letras y carátula
                castContext.addCustomMessageListener(CAST_NAMESPACE, function(customEvent) {
                    addLog('Custom message: ' + JSON.stringify(customEvent.data));
                    try {
                        var data = typeof customEvent.data === 'string' ? JSON.parse(customEvent.data) : customEvent.data;
                        if (!data) return;

                        if (data.action === 'UPDATE_LYRICS' || data.lyricsLRC !== undefined) {
                            renderLyrics(data.lyricsLRC || '');
                        }
                        if (data.coverUrl) {
                            updateCover(data.coverUrl);
                        }
                    } catch (e) {
                        addLog('Error parsing custom message: ' + e);
                    }
                });

                var playerManager = castContext.getPlayerManager();

                // 2. Interceptor de Carga Oficial: Extrae metadatos y URLs
                playerManager.setMessageInterceptor(
                    cast.framework.messages.MessageType.LOAD,
                    function(loadRequestData) {
                        addLog('LOAD message intercepted');

                        if (loadRequestData && loadRequestData.media) {
                            if (!loadRequestData.media.contentUrl && loadRequestData.media.contentId) {
                                loadRequestData.media.contentUrl = loadRequestData.media.contentId;
                            }
                            if (!loadRequestData.media.contentId && loadRequestData.media.contentUrl) {
                                loadRequestData.media.contentId = loadRequestData.media.contentUrl;
                            }

                            currentAudioUrl = loadRequestData.media.contentUrl || '';
                            addLog('Loading audio: ' + currentAudioUrl);

                            // Test URL reachability & CORS immediately
                            testAudioUrl(currentAudioUrl);

                            var customData = loadRequestData.customData || loadRequestData.media.customData;
                            if (customData) {
                                if (customData.serverUrl) {
                                    currentServerUrl = customData.serverUrl;
                                }
                                if (customData.lyricsLRC !== undefined) {
                                    renderLyrics(customData.lyricsLRC || '');
                                }
                            }

                            var meta = loadRequestData.media.metadata;
                            if (meta) {
                                if (meta.title) titleEl.innerText = meta.title;
                                if (meta.artist) artistEl.innerText = meta.artist;
                                if (meta.images && meta.images[0] && meta.images[0].url) {
                                    updateCover(meta.images[0].url);
                                } else {
                                    updateCover(null);
                                }
                            }
                        }
                        setStatus("Cargando...", false);
                        return loadRequestData;
                    }
                );

                function safeAddEventListener(target, eventType, handler) {
                    if (target && eventType) {
                        try {
                            target.addEventListener(eventType, handler);
                        } catch (e) {
                            addLog('Error adding listener: ' + eventType + ' ' + e);
                        }
                    }
                }

                // 3. Sincronización de progreso y letras
                safeAddEventListener(
                    playerManager,
                    cast.framework.events.EventType.TIME_UPDATE,
                    function(event) {
                        var current = event.currentMediaTime;
                        var duration = playerManager.getDurationSec() || 1;
                        progressFill.style.width = ((current / duration) * 100) + '%';
                        timeCurrentEl.innerText  = formatTime(current);
                        timeTotalEl.innerText    = formatTime(duration);
                        syncLyrics(current);
                    }
                );

                // 4. Estados del reproductor nativo
                safeAddEventListener(
                    playerManager,
                    cast.framework.events.EventType.MEDIA_STATUS,
                    function(event) {
                        var mediaStatus = event && event.mediaStatus;
                        if (!mediaStatus) return;
                        var state = mediaStatus.playerState;
                        var idleReason = mediaStatus.idleReason;
                        addLog('Player state: ' + state + ' | idleReason: ' + idleReason);

                        if (state === cast.framework.messages.PlayerState.PLAYING) {
                            setStatus("Transmitiendo", false);
                        } else if (state === cast.framework.messages.PlayerState.PAUSED) {
                            setStatus("En pausa", false);
                        } else if (state === cast.framework.messages.PlayerState.BUFFERING) {
                            setStatus("Cargando...", false);
                        } else if (state === cast.framework.messages.PlayerState.IDLE) {
                            if (idleReason === cast.framework.messages.IdleReason.FINISHED) {
                                setStatus("Siguiente canción...", false);
                                notifyNextTrack();
                            } else if (idleReason === cast.framework.messages.IdleReason.ERROR) {
                                setStatus("Error de reproducción (IDLE ERROR)", true);
                                showDebugError('MEDIA_STATUS IDLE ERROR', {
                                    idleReason: idleReason,
                                    audioUrl: currentAudioUrl
                                });
                            }
                        }
                    }
                );

                // 5. Listener de errores multimedia detallados
                safeAddEventListener(
                    playerManager,
                    cast.framework.events.EventType.ERROR,
                    function(event) {
                        var errCode = event && event.detailedErrorCode ? event.detailedErrorCode : (event && event.reason ? event.reason : 'unknown');
                        var errObj = {
                            detailedErrorCode: event.detailedErrorCode,
                            reason: event.reason,
                            error: event.error,
                            type: event.type
                        };
                        setStatus("Error de reproducción (" + errCode + ")", true);
                        showDebugError('PLAYER ERROR (' + errCode + ')', errObj);
                    }
                );

                var playbackConfig = new cast.framework.PlaybackConfig();
                playbackConfig.autoResumeDuration = 0;
                playbackConfig.enableCrossOriginRequests = true;

                var castOptions = new cast.framework.CastReceiverOptions();
                castOptions.disableIdleTimeout = true;
                castOptions.playbackConfig = playbackConfig;
                castOptions.customNamespaces = {};
                castOptions.customNamespaces[CAST_NAMESPACE] = cast.framework.system.MessageType.JSON;

                castContext.start(castOptions);
                castContext.setApplicationState('MMPlayer');
                console.log('CastReceiverContext started successfully');
                try {
                    castContext.sendCustomMessage(CAST_NAMESPACE, undefined, { action: 'RECEIVER_READY' });
                } catch (e) {}
            } catch (err) {
                setStatus('Error de inicialización: ' + (err ? err.message : ''), true);
                showDebugError('INIT_ERROR', err ? err.message : 'Unknown');
            }
        } else {
            setStatus('SDK no disponible', true);
            showDebugError('SDK_ERROR', 'cast.framework is undefined');
        }

        // Global Error Handler for TV On-Screen Diagnostics
        window.onerror = function(msg, url, line, col, error) {
            showDebugError('JS_EXCEPTION', msg + ' (L' + line + ':' + col + ')');
        };
    </script>
</body>
</html>
