sonar.projectKey=pescalerag_mmplayer
sonar.organization=pescalerag

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=mmplayer
sonar.projectVersion=2.4.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=src/__tests__,tests/native
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/native/**
sonar.exclusions=**/node_modules/**, **/.expo/**, **/dist/**, **/android/**, **/ios/**, **/web-build/**, **/build/**, **/coverage/**, **/__tests__/**, tests/native/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Code coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Native harnesses/stubs and build/test scripts are infrastructure, not application code.
sonar.coverage.exclusions=**/__tests__/**, **/*.test.ts, **/*.test.tsx, tests/native/**, scripts/**, **/node_modules/**, **/.expo/**, **/dist/**, **/android/**, **/ios/**, **/web-build/**, jest.config.js, jest.setup.js, src/components/**, src/screens/**, src/navigation/**, App.tsx

# Test setup and assertions do not contribute to production-code duplication metrics.
sonar.cpd.exclusions=**/__tests__/**, **/*.test.*, **/*.spec.*, tests/native/**

# Explicitly target SonarCloud
sonar.host.url=https://sonarcloud.io
